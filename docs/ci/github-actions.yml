# CI template for Tide & Toll: runs ./check on Linux and the engine-free checks on Windows.
#
# This file is a template and does nothing here. To enable it, copy it to
# .github/workflows/check.yml on a branch and push:
#   mkdir -p .github/workflows && cp docs/ci/github-actions.yml .github/workflows/check.yml
# GitHub-hosted runners are free for public repositories; private repositories use the
# account's free minutes. The Linux job downloads about 1.3 GB (Godot plus export templates)
# unless the cache below hits.
name: check

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7-stable-mono
      - name: Install toolchain
        run: sudo -E tools/setup-linux.sh
      - name: Check (build, tests, smoke, screenshot, ledger, Windows export)
        run: ./check --export
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-output
          path: |
            build/screenshots
            build/check-logs

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Simulation build and tests
        run: |
          dotnet build TideToll.sln -c Debug
          dotnet test TideToll.sln --no-build -c Debug
      - name: Ledger check
        run: python tools/check-ledger.py
      - name: Godot build and headless smoke
        shell: bash
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_mono_win64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          G="$RUNNER_TEMP/godot/Godot_v4.7-stable_mono_win64/Godot_v4.7-stable_mono_win64_console.exe"
          dotnet nuget add source "$RUNNER_TEMP/godot/Godot_v4.7-stable_mono_win64/GodotSharp/Tools/nupkgs" -n godot-4.7-local
          "$G" --headless --path game --import
          dotnet build game/TideToll.csproj
          "$G" --headless --path game res://tests/smoke.tscn --quit-after 2000
