# Builds the Windows 64-bit game (Windows 10 and 11) and attaches it to the workflow run as a zip.
#
# Where to get it: the repository's Actions tab, the newest "Windows build" run, the
# "TideToll-windows-x64" artifact at the bottom of the run page. Unzip all of it and run TideToll.exe.
#
# It runs on every push to main and to claude/ branches whose newest commit is not a work-in-progress
# commit (message starting with "Snapshot": those are skipped to save Actions minutes), and can be
# started by hand from the Actions tab once this file is on the default branch.
# The build is made on Linux by Godot's own Windows export, the same way tools/export-windows.sh
# does it locally. A private repository uses the account's free Actions minutes: about 4 minutes
# a run once the Godot download is cached.
name: Windows build

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  windows-exe:
    name: Build TideToll.exe
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Snapshot')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache Godot and its export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-mono-export

      - name: Install the small system packages Godot needs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            unzip file rsync python3 libfontconfig1 libasound2t64 \
            libxcursor1 libxinerama1 libxi6 libxrandr2 libxkbcommon0

      - name: Download Godot ${{ env.GODOT_VERSION }} (.NET) and the export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          REL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          T="$RUNNER_TEMP/godot-dl"; mkdir -p "$T"
          curl -fsSL -o "$T/g.zip" "$REL/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q -o "$T/g.zip" -d "$T/x"
          mkdir -p "$HOME/godot/${GODOT_VERSION}"
          cp -r "$T/x/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/." "$HOME/godot/${GODOT_VERSION}/"
          curl -fsSL -o "$T/t.tpz" "$REL/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q -o "$T/t.tpz" -d "$T/tx"
          TD="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$TD"
          cp -r "$T/tx/templates/." "$TD/"
          rm -rf "$T"

      - name: Put Godot on the path and register its C# packages
        run: |
          set -euo pipefail
          BIN="$HOME/godot/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          chmod +x "$BIN"
          printf '#!/bin/sh\nexec %s "$@"\n' "$BIN" | sudo tee /usr/local/bin/godot >/dev/null
          sudo chmod +x /usr/local/bin/godot
          # Godot.NET.Sdk ships only inside the Godot download; a machine that never opens the editor
          # has to register that folder with NuGet itself.
          dotnet nuget add source "$HOME/godot/${GODOT_VERSION}/GodotSharp/Tools/nupkgs" -n "godot-${GODOT_VERSION}-local"
          godot --version

      - name: Copy the assets into the game folder
        run: tools/sync-assets.sh

      - name: Export the Windows build
        run: tools/export-windows.sh

      - name: Add a short note on how to run it
        run: |
          cat > build/windows/README.txt <<EOF
          Tide & Toll, Windows 64-bit build (Windows 10 and 11)
          Built by GitHub Actions from commit ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}.

          How to run: unzip the whole folder, keep the files together, and double-click TideToll.exe.
          The .NET files the game needs are in the data_TideToll_windows_x86_64 folder next to it;
          nothing has to be installed.

          The exe is not signed, so Windows SmartScreen may say "Windows protected your PC".
          Choose "More info", then "Run anyway".

          The game is a town that grows on the page of a book. Villagers earn coin on every trip;
          spend it on the bookmarks on the right (keys 1 to 5), pave worn-in roads (P, then click
          a road) and ring the bell (Space). Each level brings new houses and roads by itself.
          Move the view with a drag, WASD or the arrow keys, zoom with the wheel; Home follows the town.

          What to check first is listed in docs/setup-windows.md in the repository.
          EOF

      - name: Attach the build to this run
        uses: actions/upload-artifact@v4
        with:
          name: TideToll-windows-x64
          path: build/windows
          if-no-files-found: error
          retention-days: 30
